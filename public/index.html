<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
    <meta name="theme-color" content="#1D3557"/>
    <meta name="description" content="ORPI Pro Amiens — Pilotage Commercial"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="ORPI Déclic"/>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png"/>
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json"/>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;0,9..40,900&display=swap" rel="stylesheet"/>
    <title>ORPI Déclic Immo — Pilotage Commercial</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'DM Sans', system-ui, sans-serif; background: #fff; }
      #root { min-height: 100vh; }
      #root:empty::before {
        content: '';
        display: flex;
      }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: linear-gradient(145deg, #1D3557 0%, #2a4a7a 60%, #E63946 100%);
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        transition: opacity 0.4s ease;
      }
      #splash.hidden { opacity: 0; pointer-events: none; }
      #splash-logo {
        background: rgba(255,255,255,0.12);
        border-radius: 20px; padding: 16px 32px;
        color: #fff; text-align: center; margin-bottom: 24px;
      }
      #splash-title { font-size: 22px; font-weight: 900; letter-spacing: 1px; }
      #splash-sub { font-size: 11px; opacity: 0.6; letter-spacing: 3px; margin-top: 4px; }
      #splash-spinner {
        width: 36px; height: 36px;
        border: 3px solid rgba(255,255,255,0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      #splash-text { color: rgba(255,255,255,0.5); font-size: 11px; margin-top: 14px; }
      @keyframes spin { to { transform: rotate(360deg); } }

    </style>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <meta name="color-scheme" content="light"/>
  </head>
  <body>
    <noscript>Cette application nécessite JavaScript.</noscript>
    <div id="splash">
      <div id="splash-logo">
        <div id="splash-title">ORPI</div>
        <div id="splash-sub">DÉCLIC IMMO</div>
      </div>
      <div id="splash-spinner"></div>
      <div id="splash-text">Chargement en cours…</div>
    </div>
    <div id="root"></div>
    <script>
      // Cacher le splash dès que React monte
      var _splashHidden = false;
      function hideSplash() {
        if (_splashHidden) return;
        _splashHidden = true;
        var s = document.getElementById('splash');
        if (s) { s.classList.add('hidden'); setTimeout(function(){ s.remove(); }, 500); }
      }
      // Fallback: cacher après 6 secondes max
      setTimeout(hideSplash, 6000);
      // Observer : dès que #root a du contenu
      var obs = new MutationObserver(function(){ if(document.getElementById('root').children.length > 0){ hideSplash(); obs.disconnect(); } });
      obs.observe(document.getElementById('root'), { childList: true });
    </script>
    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" async></script>
  </body>
</html>
